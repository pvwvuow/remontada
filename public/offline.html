<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0d1412" />
<title>آفلاین — رمانتادا</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif;
    background:
      radial-gradient(1000px 480px at 50% -10%, rgba(74, 222, 128, 0.09), transparent 60%),
      #0c1310;
    color: #edf5f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 420px;
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(74, 222, 128, 0.22);
    border-radius: 20px;
    padding: 40px 28px 32px;
  }
  .ball {
    width: 74px; height: 74px;
    margin: 0 auto 20px;
    border-radius: 22px;
    background: rgba(74, 222, 128, 0.12);
    border: 1px solid rgba(74, 222, 128, 0.3);
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-size: 20px; font-weight: 800; margin-bottom: 10px; }
  p { font-size: 13.5px; line-height: 2; color: #9fb3a8; }
  .actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button, a.btn {
    font: inherit; font-size: 13px; font-weight: 700;
    border-radius: 12px; padding: 10px 22px; cursor: pointer;
    text-decoration: none; transition: filter .15s ease;
  }
  button { background: #4ade80; color: #08130c; border: none; }
  a.btn { background: transparent; color: #cfe5d8; border: 1px solid rgba(255,255,255,.14); }
  button:hover, a.btn:hover { filter: brightness(1.1); }
  .hint { margin-top: 22px; font-size: 11.5px; color: #6f8579; line-height: 1.9; }
  .brand { margin-top: 26px; font-size: 12px; font-weight: 800; color: #4ade80; }
  .brand span { color: #edf5f0; }
</style>
</head>
<body>
  <main class="card">
    <div class="ball" aria-hidden="true">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 7l4.5 3.2-1.7 5.3H9.2L7.5 10.2 12 7z" />
      </svg>
    </div>
    <h1>اتصال اینترنت قطع است</h1>
    <p>در حال حاضر به شبکه دسترسی نداریم و نتایج زنده قابل دریافت نیست.<br />وقتی اتصال برگردد، این صفحه خودکار بارگیری می‌شود.</p>
    <div class="actions">
      <button onclick="location.reload()" type="button">تلاش مجدد</button>
      <a class="btn" href="/">رفتن به صفحه اصلی</a>
    </div>
    <p class="hint">صفحه‌هایی که قبلاً باز کرده‌اید ممکن است از حافظه‌ی دستگاه نمایش داده شوند.</p>
    <p class="brand">رمانتادا<span>.</span></p>
  </main>
  <script>
    // auto-recover as soon as the connection is back
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
